name: Update Image Digest

on:
  repository_dispatch:
    types:
      - update-buffer-tee-digest
      - update-processing-tee-digest

jobs:
  update-digest:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: main

      - name: Update buffer-tee digest
        if: github.event.action == 'update-buffer-tee-digest'
        env:
          DIGEST: ${{ github.event.client_payload.digest }}
        run: |
          echo "Updating buffer-tee digest to: $DIGEST"
          grep -n "EXPECTED_IMAGE_DIGEST" src/constants.ts
          sed -i "s|export const EXPECTED_IMAGE_DIGEST *= *\"sha256:[^\"]*\"|export const EXPECTED_IMAGE_DIGEST            = \"${DIGEST}\"|g" src/constants.ts
          echo "After update:"
          cat src/constants.ts

      - name: Update processing-tee digest
        if: github.event.action == 'update-processing-tee-digest'
        env:
          DIGEST: ${{ github.event.client_payload.digest }}
        run: |
          echo "Updating processing-tee digest to: $DIGEST"
          sed -i "s|export const EXPECTED_PROCESSING_IMAGE_DIGEST *= *\"sha256:[^\"]*\"|export const EXPECTED_PROCESSING_IMAGE_DIGEST = \"${DIGEST}\"|g" src/constants.ts
          echo "After update:"
          cat src/constants.ts

      - name: Commit and push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/constants.ts
          git diff --staged --quiet && echo "No changes to commit" || git commit -m "ci: update image digest for ${{ github.event.action }}"
          git push
