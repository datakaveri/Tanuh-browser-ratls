name: Update Image Digest

on:
  repository_dispatch:
    types:
      - update-buffer-tee-digest
      - update-processing-tee-digest

jobs:
  update-digest:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: main

      - name: Update digest in constants.ts
        env:
          DIGEST: ${{ github.event.client_payload.digest }}
          COMPONENT: ${{ github.event.client_payload.component }}
        run: |
          echo "Component: $COMPONENT"
          echo "Digest: $DIGEST"
          echo "=== Before ==="
          cat src/constants.ts

          if [ "$COMPONENT" = "buffer-tee" ]; then
            python3 -c "
import re, os
digest = os.environ['DIGEST']
content = open('src/constants.ts').read()
print('Looking for EXPECTED_IMAGE_DIGEST...')
print('Found:', 'EXPECTED_IMAGE_DIGEST' in content)
updated = re.sub(
    r'(export const EXPECTED_IMAGE_DIGEST\s*=\s*)\"sha256:[^\"]*\"',
    r'\g<1>\"' + digest + '\"',
    content
)
open('src/constants.ts', 'w').write(updated)
print('Done')
"
          elif [ "$COMPONENT" = "processing-tee" ]; then
            python3 -c "
import re, os
digest = os.environ['DIGEST']
content = open('src/constants.ts').read()
updated = re.sub(
    r'(export const EXPECTED_PROCESSING_IMAGE_DIGEST\s*=\s*)\"sha256:[^\"]*\"',
    r'\g<1>\"' + digest + '\"',
    content
)
open('src/constants.ts', 'w').write(updated)
print('Done')
"
          fi

          echo "=== After ==="
          cat src/constants.ts

      - name: Commit and push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/constants.ts
          git diff --staged --quiet && echo "No changes to commit" || git commit -m "ci: update ${{ github.event.client_payload.component }} image digest to ${{ github.event.client_payload.digest }}"
          git push
