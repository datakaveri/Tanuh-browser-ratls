name: Update Image Digest

on:
  repository_dispatch:
    types:
      - update-buffer-tee-digest
      - update-processing-tee-digest

jobs:
  update-digest:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: main

      - name: Update digest in constants.ts
        run: |
          DIGEST="${{ github.event.client_payload.digest }}"
          COMPONENT="${{ github.event.client_payload.component }}"
          echo "Component: $COMPONENT"
          echo "Digest: $DIGEST"
          echo "Before update:"
          cat src/constants.ts
          if [ "$COMPONENT" = "buffer-tee" ]; then
            python3 << PYEOF
import re
content = open('src/constants.ts').read()
digest = "$DIGEST"
updated = re.sub(
    r'export const EXPECTED_IMAGE_DIGEST\s*=\s*"sha256:[^"]*"',
    f'export const EXPECTED_IMAGE_DIGEST            = "{digest}"',
    content
)
open('src/constants.ts', 'w').write(updated)
print('Done')
PYEOF
          elif [ "$COMPONENT" = "processing-tee" ]; then
            python3 << PYEOF
import re
content = open('src/constants.ts').read()
digest = "$DIGEST"
updated = re.sub(
    r'export const EXPECTED_PROCESSING_IMAGE_DIGEST\s*=\s*"sha256:[^"]*"',
    f'export const EXPECTED_PROCESSING_IMAGE_DIGEST = "{digest}"',
    content
)
open('src/constants.ts', 'w').write(updated)
print('Done')
PYEOF
          fi
          echo "After update:"
          cat src/constants.ts

      - name: Commit and push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/constants.ts
          git diff --staged --quiet || git commit -m "ci: update ${{ github.event.client_payload.component }} image digest

          Component: ${{ github.event.client_payload.component }}
          Digest:    ${{ github.event.client_payload.digest }}
          Source:    ${{ github.event.client_payload.commit_sha }}"
          git push
