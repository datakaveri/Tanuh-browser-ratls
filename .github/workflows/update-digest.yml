name: Update Buffer TEE Image Digest

on:
  repository_dispatch:
    types:
      - update-buffer-tee-digest

jobs:
  update-digest:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: main

      - name: Update digest in constants.ts
        run: |
          DIGEST="${{ github.event.client_payload.digest }}"
          echo "Updating Buffer TEE digest to: $DIGEST"
          sed -i "s|export const EXPECTED_IMAGE_DIGEST = \"sha256:[^\"]*\"|export const EXPECTED_IMAGE_DIGEST = \"$DIGEST\"|" src/lib/constants.ts
          echo "Updated constants.ts:"
          cat src/lib/constants.ts

      - name: Commit and push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/lib/constants.ts
          git diff --staged --quiet || git commit -m "ci: update buffer-tee image digest

          Digest: ${{ github.event.client_payload.digest }}
          Source: ${{ github.event.client_payload.commit_sha }}"
          git push

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build
